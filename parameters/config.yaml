# ============================================================
# Configuration for the suite2p HPC pipeline
#
# Edit the values below to match your setup. All three scripts
# (jobscript_s2p_pj.sh, dataexchange.py, suite2p_pipeline.py)
# read their parameters from this single file.
# ============================================================

# --- Filesystem paths ---------------------------------------

# Cluster directory that holds one folder per uploaded recording.
# Each folder is named after the raw file (animalID_date_time_xxx) and holds
# the raw file plus its suite2p output.
# Used by jobscript_s2p_pj.sh (find) and dataexchange.py (cluster_path).
cluster_data_path: /lustre/scratch/data/jtim_hpc-2Panalysis

# Conda environment to activate on the cluster.
# Used by jobscript_s2p_pj.sh.
conda_env_path: /home/jtim_hpc/.conda/envs/suite2p

# Local folder that contains ALL raw imaging files in one place.
# Files are named animalID_date_time_xxx.nd2 (xxx = any extra info, e.g.
# sessionnumber_sessionID). Used by dataexchange.py (data_path).
local_data_path: Z:/josephine_timm/treadwall

# Local folder where processed results are stored. One subfolder per analyzed
# file, named animalID_xxx, containing the suite2p output (no raw file).
# Used by dataexchange.py (results_path).
results_path: Y:/ag_beck/josephine_timm/suite2p/results/treadwall

# Plain-text log of experiments that have already been uploaded/analyzed
# (one raw file name per line). Used by the "only not-yet-analyzed" upload
# option and appended to automatically as new files are uploaded.
# Used by dataexchange.py (analyzed_log_path).
analyzed_log_path: Y:/ag_beck/josephine_timm/suite2p/analyzed_experiments.txt

# SSH login string for the cluster (user@host).
# Used by dataexchange.py (login_string).
login_string: jtim_hpc@marvin.hpc.uni-bonn.de

# key path
key_path: C:/Users/TomBombadil/.ssh/id_ed25519_setup

# Canonical session IDs (5th field of raw session file names
# animalID_date_time_sessionnum_sessionID). Used by dataexchange.py to
# tell real session files apart from test files / FOV images in the raw
# data folder (upload option 3).
session_ids: [B1, B2, H1, H2, Sc1, Sc2, P1, P2]

# --- Preprocessing ---
# remove noise from scan head
preprocess:
  remove_ripple: true               # master switch for FFT-based ripple noise removal (first channel only)
  ripple_amplitude_threshold: 10.8  # log-amplitude threshold for spike detection
  ripple_win: 40                    # half-size of DC mask window (pixels)

# --- Suite2p parameters (suite2p 1.1.0 nested structure) ----
# Every tunable parameter is listed with its default; change any value as needed.
# db  = file input/output; settings = pipeline parameters (grouped by stage).
# data_path and save_path0 are set automatically by the pipeline (per recording).
# Algorithm-specific params (diameter, sourcery_settings, cellpose_settings) are
# omitted because detection.algorithm is 'sparsery'; add them back only if you
# switch algorithm (suite2p fills their defaults otherwise).
suite2p:

  db:
    input_format: nd2            # ['tif','h5','nwb','bruker','movie','dcimg','nd2']
    nchannels: 2                 # 1- or 2-channel recording
    functional_chan: 1           # channel used for functional ROIs (1-based)
    nplanes: 1                   # planes per file
    keep_movie_raw: false        # keep non-registered binary (REQUIRED if two_step_registration)
    look_one_level_down: false   # also search subfolders of each data_path
    force_sktiff: false          # (tiff only) use tifffile instead of scanimage reader
    batch_size: 500              # frames/batch when WRITING binaries (tiff/h5; nd2 ignores)
    # fast_disk: null            # SSD dir for temporary binary (defaults to save_path0)

  settings:
    # ---- general ----
    tau: 1.3                     # indicator decay (s) for deconvolution + binning
    fs: 15                       # sampling rate per plane (Hz)
    torch_device: cuda           # 'cuda' (GPU) or 'cpu'
    # diameter: [12, 12]         # ROI diameter (Y,X) px — ONLY used for sourcery/cellpose

    run:
      do_registration: 1         # 0=off, 1=on, 2=force re-registration
      do_regmetrics: true        # compute registration quality metrics (needs >=1500 frames)
      do_detection: true         # ROI detection + extraction (old 'roidetect')
      do_deconvolution: true     # spike deconvolution (old 'spikedetect')
      multiplane_parallel: false # run each plane as a separate server job

    io:
      delete_bin: false          # delete data.bin after processing
      move_bin: false            # move binary from fast_disk to save_path when done
      combined: true             # combine planes into a single result
      save_mat: false            # also save Fall.mat (MATLAB)
      save_NWB: false            # also save NWB file
      save_ops_orig: true        # save db/settings/reg_outputs/detection_outputs into ops

    registration:
      nimg_init: 300             # subsampled frames used to build the reference image
      batch_size: 200            # frames per registration batch (lower if GPU runs out of memory)
      maxregshift: 0.1           # max rigid shift as fraction of frame max(width,height)
      align_by_chan2: false      # align using the non-functional channel
      nonrigid: true             # use nonrigid registration
      block_size: [128, 128]     # nonrigid block size (keep multiples of 2/3)
      maxregshiftNR: 5           # max nonrigid pixel shift relative to rigid
      snr_thresh: 1.2            # nonrigid block SNR threshold below which blocks are smoothed
      smooth_sigma: 1.8          # XY gaussian smoothing (~1 for 2P, 3-5 for 1P)
      smooth_sigma_time: 0       # temporal gaussian smoothing for shift estimation
                                 # NOTE: must stay 0 — values >0 crash this suite2p build
                                 # (registration temporal_smooth returns numpy, breaks torch.argmax)
      subpixel: 10               # subpixel precision (1/subpixel steps)
      spatial_taper: 3.45        # edge taper width (px); larger for 1P
      th_badframes: 1.0          # threshold to exclude bad frames when cropping (smaller = exclude more)
      norm_frames: true          # normalize frames when detecting shifts
      do_bidiphase: true         # compute bidirectional phase offset from the data
      bidiphase: 0               # fixed bidi offset (used only if do_bidiphase is false)
      two_step_registration: false  # register twice (low-SNR data); REQUIRES db.keep_movie_raw=true
      upsample_meanImg: null     # super-resolution meanImg upsample factor (null/0 = off)
      reg_tif: false             # save registered tiffs
      reg_tif_chan2: false       # save chan2 registered tiffs

    detection:
      algorithm: sparsery        # ['sparsery','sourcery','cellpose']
      threshold_scaling: 1       # higher -> fewer ROIs detected
      max_overlap: 0.75          # discard ROIs overlapping more than this fraction with others
      nbins: 5000                # max binned frames for detection (reduce if RAM-limited)
      bin_size: null             # bin size in frames; null -> auto from tau/fs
      highpass_time: 50          # temporal running-mean subtraction window (in bins)
      denoise: true              # PCA-denoise the binned movie before detection
      block_size: [64, 64]       # block size used by denoising
      soma_crop: true            # crop dendrites when computing ROI stats
      npix_norm_min: 0.0         # minimum normalized npix for an ROI
      npix_norm_max: 100         # maximum normalized npix for an ROI
      chan2_threshold: 0.25      # IoU threshold to mark an ROI as present in chan2 (2-channel only)
      cellpose_chan2: false      # run cellpose on the anatomical channel and overlap with ROIs
      sparsery_settings:
        highpass_neuropil: 25    # px highpass on binned movie to subtract neuropil
        max_ROIs: 5000           # maximum number of ROIs to detect
        spatial_scale: 0         # 0=auto; 1=6px, 2=12px, 3=24px, 4=48px
        active_percentile: 0.0   # percentile of active pixels used for thresholding

    extraction:
      neuropil_extract: true     # extract neuropil signal (Fneu); false -> Fneu=0
      neuropil_coefficient: 0.7  # neuropil subtraction coefficient
      inner_neuropil_radius: 2   # px gap between ROI and its neuropil donut
      min_neuropil_pixels: 350   # minimum neuropil pixels per ROI
      lam_percentile: 50.0       # ROI-weight percentile ignored when excluding cell pixels
      allow_overlap: false       # keep overlapping pixels in both ROIs (true) or discard (false)
      circular_neuropil: false   # circular (slower) vs square neuropil masks
      batch_size: 500            # extraction batch size
      snr_threshold: 0.0         # ROI SNR threshold

    classification:
      use_builtin_classifier: false  # built-in classifier vs user classifier
      classifier_path: null          # path to classifier file (null = default user classifier)
      preclassify: 0.0               # drop ROIs below this probability before extraction (0 = off)

    dcnv_preprocess:
      baseline: maximin          # baseline method ['maximin','prctile','constant']
      win_baseline: 60.0         # maximin window (s)
      sig_baseline: 10.0         # gaussian filter width (frames)
      prctile_baseline: 8.0      # percentile baseline (used only if baseline='prctile')
